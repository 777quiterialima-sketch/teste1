<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💚 Organizador Financeiro</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --verde:   #22c55e;
      --verde-dk:#16a34a;
      --amarelo: #f59e0b;
      --vermelho:#ef4444;
      --cinza:   #f1f5f9;
      --texto:   #0f172a;
      --sub:     #64748b;
      --card:    #ffffff;
      --borda:   #e2e8f0;
      --radius:  14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--cinza); color: var(--texto); min-height: 100vh;
    }
    header {
      background: var(--verde-dk); color: #fff; padding: 20px 32px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -.3px; }
    header span { font-size: .9rem; opacity: .8; }
    .container { max-width: 1100px; margin: 0 auto; padding: 28px 20px; }

    /* Cards do topo */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .card {
      background: var(--card); border-radius: var(--radius);
      border: 1px solid var(--borda); padding: 20px 22px;
    }
    .card-label { font-size: .78rem; color: var(--sub); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
    .card-value { font-size: 1.65rem; font-weight: 700; }
    .card-sub   { font-size: .82rem; color: var(--sub); margin-top: 4px; }
    .verde  { color: var(--verde-dk); }
    .amarelo{ color: var(--amarelo); }
    .vermelho{ color: var(--vermelho); }

    /* Progress bar */
    .progress-wrap { background: var(--cinza); border-radius: 99px; height: 10px; margin-top: 10px; overflow: hidden; }
    .progress-bar  { height: 10px; border-radius: 99px; background: var(--verde); transition: width .5s; }
    .progress-bar.warn { background: var(--amarelo); }
    .progress-bar.over { background: var(--vermelho); }

    /* Grid de duas colunas */
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
    @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }

    /* Seção genérica */
    .section {
      background: var(--card); border-radius: var(--radius);
      border: 1px solid var(--borda); padding: 22px;
    }
    .section h2 { font-size: 1rem; font-weight: 600; margin-bottom: 18px; }

    /* Categoria rows */
    .cat-row { margin-bottom: 14px; }
    .cat-header { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: .9rem; }
    .cat-name   { font-weight: 500; }
    .cat-val    { color: var(--sub); font-size: .85rem; }

    /* Tabela de gastos */
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th    { text-align: left; color: var(--sub); font-size: .75rem; text-transform: uppercase; letter-spacing: .4px; padding: 0 8px 10px; }
    td    { padding: 10px 8px; border-top: 1px solid var(--borda); vertical-align: top; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 99px;
      font-size: .74rem; font-weight: 600; background: var(--cinza);
    }

    /* Metas */
    .meta-item { margin-bottom: 18px; }
    .meta-item:last-child { margin-bottom: 0; }
    .meta-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .meta-nome { font-weight: 600; font-size: .93rem; }
    .meta-pct  { font-size: .82rem; color: var(--sub); }
    .meta-sub  { font-size: .8rem; color: var(--sub); margin-top: 5px; }

    /* Chart canvas */
    canvas { max-height: 220px; }

    .atualizado { text-align: center; font-size: .78rem; color: var(--sub); margin-top: 20px; }
    .spinner { text-align: center; padding: 60px; color: var(--sub); font-size: .9rem; }
  </style>
</head>
<body>

<header>
  <h1>💚 Organizador Financeiro</h1>
  <span id="mes-label">—</span>
</header>

<div class="container">
  <div id="app"><div class="spinner">Carregando dados...</div></div>
</div>

<script>
const CORES = [
  '#22c55e','#3b82f6','#f59e0b','#ef4444',
  '#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316',
];

const CAT_EMOJI = {
  'Alimentação':'🍽️','Transporte':'🚌','Habitação':'🏠',
  'Saúde':'💊','Contas':'⚡','Lazer':'🎬','Educação':'📚',
  'Compras':'🛍️','Outros':'💸',
};

function fmt(v) {
  return v == null ? '—' : 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function pctBar(pct, cls='') {
  const p = Math.min(100, Math.max(0, pct || 0));
  const extra = p > 90 ? 'over' : p > 70 ? 'warn' : '';
  return `<div class="progress-wrap"><div class="progress-bar ${extra}" style="width:${p}%"></div></div>`;
}

function statusCor(pct) {
  if (pct == null) return '';
  if (pct > 95) return 'vermelho';
  if (pct > 75) return 'amarelo';
  return 'verde';
}

let chartInstance = null;

function renderizar(d) {
  document.getElementById('mes-label').textContent = d.mes;

  const pct = d.pct_gasto;
  const cor  = statusCor(pct);

  // Cards do topo
  const cards = `
    <div class="cards">
      <div class="card">
        <div class="card-label">Renda</div>
        <div class="card-value verde">${fmt(d.renda || null)}</div>
        <div class="card-sub">base mensal</div>
      </div>
      <div class="card">
        <div class="card-label">Total Gasto</div>
        <div class="card-value ${cor}">${fmt(d.total_gasto)}</div>
        <div class="card-sub">${pct != null ? pct.toFixed(1)+'% da renda' : 'este mês'}</div>
        ${pct != null ? pctBar(pct) : ''}
      </div>
      <div class="card">
        <div class="card-label">Saldo Livre</div>
        <div class="card-value ${d.saldo < 0 ? 'vermelho':'verde'}">${fmt(d.saldo)}</div>
        <div class="card-sub">${d.saldo != null ? (d.saldo >= 0 ? 'disponível' : 'acima do orçamento') : 'configure a renda'}</div>
      </div>
      <div class="card">
        <div class="card-label">Meta de Economia</div>
        <div class="card-value">${fmt(d.meta_economia || null)}</div>
        <div class="card-sub">objetivo mensal</div>
      </div>
    </div>`;

  // Categorias
  const cats = Object.entries(d.por_categoria).sort((a,b) => b[1]-a[1]);
  const totalCats = cats.reduce((s,[,v]) => s+v, 0);
  const catRows = cats.map(([nome, valor]) => {
    const p = totalCats > 0 ? valor/totalCats*100 : 0;
    const emoji = CAT_EMOJI[nome] || '💸';
    return `<div class="cat-row">
      <div class="cat-header">
        <span class="cat-name">${emoji} ${nome}</span>
        <span class="cat-val">${fmt(valor)} &nbsp;${p.toFixed(0)}%</span>
      </div>
      ${pctBar(p)}
    </div>`;
  }).join('') || '<p style="color:var(--sub);font-size:.9rem">Nenhum gasto registrado ainda.</p>';

  // Metas
  const metasHtml = (d.metas || []).map(m => {
    const p = m.valor_total > 0 ? m.valor_acumulado/m.valor_total*100 : 0;
    const faltam = m.valor_total - m.valor_acumulado;
    return `<div class="meta-item">
      <div class="meta-header">
        <span class="meta-nome">🎯 ${m.nome}</span>
        <span class="meta-pct">${p.toFixed(0)}%</span>
      </div>
      ${pctBar(p)}
      <div class="meta-sub">${fmt(m.valor_acumulado)} de ${fmt(m.valor_total)} — faltam ${fmt(faltam)}</div>
    </div>`;
  }).join('') || '<p style="color:var(--sub);font-size:.9rem">Sem metas. Envie /novameta no DM.</p>';

  // Últimos gastos
  const linhasGastos = (d.ultimos_gastos || []).map(g => {
    const data = g.data ? g.data.slice(8,10)+'/'+g.data.slice(5,7) : '—';
    const emoji = CAT_EMOJI[g.categoria] || '💸';
    return `<tr>
      <td>${data}</td>
      <td>${g.descricao}</td>
      <td><span class="badge">${emoji} ${g.categoria}</span></td>
      <td style="font-weight:600">${fmt(g.valor)}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="4" style="color:var(--sub);padding:20px 8px">Nenhum gasto ainda.</td></tr>';

  document.getElementById('app').innerHTML = `
    ${cards}
    <div class="grid2">
      <div class="section">
        <h2>📂 Por Categoria</h2>
        ${catRows}
      </div>
      <div class="section" style="display:flex;flex-direction:column;gap:16px">
        <h2>📊 Distribuição</h2>
        <canvas id="graficoCat"></canvas>
      </div>
    </div>
    <div class="grid2">
      <div class="section">
        <h2>🎯 Metas Financeiras</h2>
        ${metasHtml}
      </div>
      <div class="section">
        <h2>📝 Últimos Gastos</h2>
        <table>
          <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th></tr></thead>
          <tbody>${linhasGastos}</tbody>
        </table>
      </div>
    </div>
    <p class="atualizado">Atualiza automaticamente a cada 30s · ${new Date().toLocaleTimeString('pt-BR')}</p>
  `;

  // Gráfico de rosca
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  if (cats.length > 0) {
    const ctx = document.getElementById('graficoCat');
    if (ctx) {
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: cats.map(([n]) => n),
          datasets: [{ data: cats.map(([,v]) => v), backgroundColor: CORES, borderWidth: 2, borderColor: '#fff' }]
        },
        options: {
          cutout: '65%',
          plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 12 } } },
        }
      });
    }
  }
}

async function carregar() {
  try {
    const r = await fetch('/api/dados');
    const d = await r.json();
    renderizar(d);
  } catch(e) {
    document.getElementById('app').innerHTML =
      '<div class="spinner">Erro ao carregar dados. Verifique se o servidor está rodando.</div>';
  }
}

carregar();
setInterval(carregar, 30_000);
</script>
</body>
</html>
