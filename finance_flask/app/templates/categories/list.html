{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Categorias</h3>
  <a class="btn btn-success" href="{{ url_for('categories.new_category') }}">Nova categoria</a>
</div>
<div class="card">
  <div class="card-body">
    <table class="table">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Tipo</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for category in categories %}
        <tr>
          <td>{{ category.name }}</td>
          <td>{{ category.type }}</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('categories.edit_category', category_id=category.id) }}">Editar</a>
            <form method="post" action="{{ url_for('categories.delete_category', category_id=category.id) }}" class="d-inline">
              {{ csrf_token() }}
              <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
            </form>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="3">Nenhuma categoria cadastrada.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
